[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migreplay"
version = "0.1.0"
description = "Rehearse SQLite migrations on synthetic data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
migreplay = "migreplay.cli:main"

[tool.setuptools]
packages = ["migreplay"]

[tool.setuptools.package-data]
migreplay = ["demo_cases/*/*.json", "demo_cases/*/*.sql"]
